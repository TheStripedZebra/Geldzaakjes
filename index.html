<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geldzaakjes App</title>
    <style>
        :root {
            --bg-dark: #070913;
            --card-bg: #111528;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            
            --gradient-accent: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            --gradient-total: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(139, 92, 246, 0.15) 100%);
            
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top, #1e1b4b 0%, #070913 70%);
            user-select: none;
            -webkit-user-select: none;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 85vh;
            position: relative;
            overflow: hidden;
        }

        h1, h2 {
            margin-top: 0;
            color: var(--text-main);
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
        }

        button {
            background: var(--gradient-accent);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            opacity: 0.9;
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.08);
            box-shadow: none;
            color: var(--text-main);
        }
        button.secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        button.danger {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            box-shadow: none;
        }
        button.danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        button.heavy-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 2px solid #ef4444;
            box-shadow: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 6px 12px;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        button.heavy-danger:hover {
            background: rgba(239, 68, 68, 0.35);
        }

        button.warning-red {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            box-shadow: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        button.warning-red:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        button.success {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            box-shadow: none;
        }
        button.success:hover {
            background: rgba(16, 185, 129, 0.3);
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #8b5cf6;
        }

        input::placeholder {
            color: #6b7280;
        }

        .screen {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .screen.active {
            display: flex;
        }

        .list-item-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scrollable-list {
            flex: 1;
            overflow-y: auto;
            max-height: 380px;
            margin-bottom: 15px;
            border-top: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
            padding-top: 12px;
            padding-bottom: 12px;
        }

        .total-section {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            padding: 16px;
            background: var(--gradient-total);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 14px;
            margin-bottom: 15px;
            align-items: center;
        }

        /* SWIPE CONTAINER */
        .swipe-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 12px;
            overflow: hidden;
            border-radius: 14px;
        }

        .swipe-action-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(239, 68, 68, 0.3);
            border: 1px solid rgba(239, 68, 68, 0.5);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 24px;
            color: #f87171;
            z-index: 1;
        }

        .folder-card, .list-card {
            position: relative;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 2;
            transition: background 0.2s, border-color 0.2s;
            touch-action: pan-y;
        }

        .folder-card.drag-over {
            border-color: #38bdf8 !important;
            background: rgba(56, 189, 248, 0.1) !important;
            transform: scale(1.02);
        }

        .folder-card:hover, .list-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .section-header {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin: 16px 0 8px 4px;
            font-weight: 700;
        }

        .badge {
            font-size: 11px;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            text-align: center;
        }
        .badge.openstaand { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge.afgerond { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge.archief { background: rgba(156, 163, 175, 0.2); color: #9ca3af; border: 1px solid rgba(156, 163, 175, 0.3); }

        .actions-bottom {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #fabBtn {
            position: absolute;
            bottom: 24px;
            right: 24px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--gradient-accent);
            color: white;
            border: none;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.5);
            cursor: pointer;
            z-index: 50;
            transition: transform 0.2s;
        }
        #fabBtn:active {
            transform: scale(0.92);
        }

        #fabDropdown {
            display: none;
            position: absolute;
            bottom: 90px;
            right: 24px;
            background: #1a203c;
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.6);
            z-index: 60;
            overflow: hidden;
            width: 180px;
        }
        .fab-option {
            padding: 14px 16px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            background: transparent;
            border: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            box-shadow: none;
            border-radius: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .fab-option:hover {
            background: rgba(255, 255, 255, 0.08);
            opacity: 1;
        }
        .fab-option:not(:last-child) {
            border-bottom: 1px solid var(--card-border);
        }

        #modalOverlay, #moveModalOverlay, #inputModalOverlay, #editListModalOverlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(7, 9, 19, 0.85);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-radius: 24px;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .color-picker-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .color-option {
            height: 40px;
            border-radius: 10px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s;
        }

        .color-option:hover {
            transform: scale(1.05);
        }

        .color-option.selected {
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <div id="homeScreen" class="screen active" style="position: relative;">
        <h1>Geldzaakjes</h1>
        <p style="margin-top: 4px;">Organiseer je mappen en lijsten.</p>

        <div class="scrollable-list" id="foldersContainer" style="border-top: none;"></div>

        <div id="fabDropdown">
            <button type="button" class="fab-option" id="menuAddListBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg> Lijst toevoegen
            </button>
            <button type="button" class="fab-option" id="menuAddFolderBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8b5cf6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg> Map toevoegen
            </button>
        </div>
        <button type="button" id="fabBtn">+</button>
    </div>

    <div id="folderDetailScreen" class="screen">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
            <button type="button" class="secondary" id="backToHomeBtn">← Terug</button>
            <h2 id="currentFolderName" style="margin: 0; font-size: 18px; text-align: center; flex: 1; padding: 0 10px;">Map</h2>
        </div>

        <div id="createListInFolderSection" style="margin-bottom: 15px;">
            <input type="text" id="newListNameInFolder" placeholder="Naam nieuwe lijst in deze map">
            <button type="button" id="createListInFolderBtn" style="width: 100%;">Lijst Aanmaken in deze Map</button>
        </div>

        <div class="scrollable-list" id="folderListsContainer"></div>
    </div>

    <div id="detailScreen" class="screen">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; gap: 8px;">
            <button type="button" class="secondary" id="backToFolderBtn" style="padding: 10px 14px;">← Terug</button>
            <h2 id="currentListTitle" style="margin: 0; font-size: 18px; text-align: center; flex: 1; padding: 0 5px;">Lijst</h2>
            
            <div style="display: flex; align-items: center; gap: 6px;">
                <span id="currentListStatus" class="badge openstaand">Openstaand</span>
                <div id="topActionContainer"></div>
            </div>
        </div>

        <div id="inputSection" style="margin-bottom: 10px;">
            <input type="text" id="itemDescription" placeholder="Omschrijving (bijv. Supermarkt)">
            <input type="number" id="amountInput" step="0.01" placeholder="Bedrag in € (bijv. 12.50)">
            <button type="button" id="addAmountBtn" style="width: 100%;">Bedrag Toevoegen</button>
        </div>

        <div class="scrollable-list" id="amountsContainer"></div>

        <div class="total-section">
            <span style="color: var(--text-muted); font-size: 15px;">Totaalbedrag:</span>
            <span id="totalAmount" style="color: #34d399; font-size: 20px;">€ 0,00</span>
        </div>

        <div class="actions-bottom" id="actionButtonsContainer"></div>
    </div>

    <div id="inputModalOverlay">
        <div class="modal-box">
            <h2 id="inputModalTitle">Nieuw item</h2>
            <p id="inputModalDesc" style="margin-bottom: 15px;">Geef een naam op:</p>
            
            <input type="text" id="dynamicInputName" placeholder="Naam...">
            
            <div id="colorPickerSection" style="display: none;">
                <label style="font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 8px;">Kies een kleur:</label>
                <div class="color-picker-grid" id="quickColorPickerGrid"></div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" class="secondary" id="inputModalCancelBtn" style="flex: 1;">Annuleren</button>
                <button type="button" id="inputModalSaveBtn" style="flex: 1;">Aanmaken</button>
            </div>
        </div>
    </div>

    <div id="modalOverlay">
        <div class="modal-box">
            <h2>Map Wijzigen</h2>
            <p style="margin-bottom: 15px;">Pas de naam en icoonkleur aan.</p>
            
            <input type="text" id="modalFolderNameInput" placeholder="Naam van de map">
            
            <label style="font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 8px;">Kies een kleur:</label>
            <div class="color-picker-grid" id="colorPickerGrid"></div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" class="secondary" id="modalCancelBtn" style="flex: 1;">Annuleren</button>
                <button type="button" id="modalSaveBtn" style="flex: 1;">Opslaan</button>
            </div>
        </div>
    </div>

    <div id="editListModalOverlay">
        <div class="modal-box">
            <h2>Lijst Wijzigen</h2>
            <p style="margin-bottom: 15px;">Pas de naam en icoonkleur aan.</p>
            
            <input type="text" id="modalListNameInput" placeholder="Naam van de lijst">
            
            <label style="font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 8px;">Kies een kleur:</label>
            <div class="color-picker-grid" id="editListColorPickerGrid"></div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" class="secondary" id="editListCancelBtn" style="flex: 1;">Annuleren</button>
                <button type="button" id="editListSaveBtn" style="flex: 1;">Opslaan</button>
            </div>
        </div>
    </div>
</div>

<script>
    let appData = {
        folders: [
            { id: 'default', name: 'Algemeen', color: '#3b82f6' },
            { id: 'archief', name: 'Archief', color: '#9ca3af' }
        ],
        lists: []
    };

    const availableColors = [
        { name: 'Neon Blauw', hex: '#3b82f6' },
        { name: 'Paars', hex: '#8b5cf6' },
        { name: 'Roze', hex: '#ec4899' },
        { name: 'Groen', hex: '#10b981' },
        { name: 'Oranje', hex: '#f59e0b' },
        { name: 'Rood', hex: '#ef4444' },
        { name: 'Cyaan', hex: '#06b6d4' },
        { name: 'Zilver', hex: '#9ca3af' }
    ];

    try {
        const saved = localStorage.getItem('bedragLijsten_v31');
        if (saved) {
            appData = JSON.parse(saved);
            if (!appData.folders.some(f => f.id === 'archief')) {
                appData.folders.push({ id: 'archief', name: 'Archief', color: '#9ca3af' });
            }
            if (!appData.folders.some(f => f.id === 'default')) {
                appData.folders.unshift({ id: 'default', name: 'Algemeen', color: '#3b82f6' });
            }
            appData.folders.forEach(f => { if (!f.color) f.color = '#3b82f6'; });
            appData.lists.forEach(l => { if (!l.color) l.color = '#38bdf8'; });
        }
    } catch (e) {
        console.error("Fout bij laden opslag:", e);
    }

    let activeFolderId = null;
    let activeListId = null;
    let editingFolderId = null;
    let editingListId = null;
    let selectedColorHex = '#3b82f6';
    let selectedListColorHex = '#38bdf8';
    let inputModalMode = null;

    function saveToStorage() {
        try {
            localStorage.setItem('bedragLijsten_v31', JSON.stringify(appData));
        } catch (e) {
            console.error("Fout bij opslaan:", e);
        }
    }

    function renderFolders() {
        const container = document.getElementById('foldersContainer');
        if (!container) return;
        container.innerHTML = '';

        const folderHeader = document.createElement('div');
        folderHeader.className = 'section-header';
        folderHeader.innerText = 'Mappen';
        container.appendChild(folderHeader);

        appData.folders.forEach(folder => {
            const folderLists = appData.lists.filter(l => l.folderId === folder.id);
            const folderColor = folder.color || '#3b82f6';
            const folderSvg = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${folderColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -3px; margin-right: 6px;">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
            `;

            let actionButtonsHtml = `
                <button type="button" class="warning-red rename-folder-btn" data-id="${folder.id}" style="padding: 6px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> Wijzig
                </button>`;

            const cardContent = `
                <div style="flex: 1; cursor: pointer;" class="open-folder-target" data-id="${folder.id}">
                    <strong style="font-size: 16px;">${folderSvg}<span style="color: var(--text-main);">${escapeHtml(folder.name)}</span></strong><br>
                    <small style="color: var(--text-muted);">${folderLists.length} lijsten</small>
                </div>
                <div style="display: flex; align-items: center; gap: 6px;">
                    ${actionButtonsHtml}
                </div>
            `;

            const isProtected = (folder.id === 'default' || folder.id === 'archief');
            const wrapper = createSwipeWrapper(folder.id, 'folder', cardContent, isProtected);
            container.appendChild(wrapper);
        });

        const standaloneLists = appData.lists.filter(l => !l.folderId);
        
        const listHeader = document.createElement('div');
        listHeader.className = 'section-header';
        listHeader.style.marginTop = '24px';
        listHeader.innerText = 'Lijsten';
        container.appendChild(listHeader);

        if (standaloneLists.length === 0) {
            const emptyNotice = document.createElement('p');
            emptyNotice.style.fontSize = '13px';
            emptyNotice.style.color = 'var(--text-muted)';
            emptyNotice.style.marginLeft = '4px';
            emptyNotice.innerText = 'Geen lijsten op het beginscherm.';
            container.appendChild(emptyNotice);
        } else {
            standaloneLists.forEach(list => {
                const items = list.items || [];
                const total = items.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
                
                let statusClass = 'openstaand';
                let statusText = 'Openstaand';
                if (list.status === 'afgerond') { statusClass = 'afgerond'; statusText = 'Afgerond'; }
                else if (list.status === 'archief') { statusClass = 'archief'; statusText = 'Archief'; }

                const listColor = list.color || '#38bdf8';
                const listSvg = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${listColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -3px; margin-right: 6px;">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                    </svg>
                `;

                const cardContent = `
                    <div style="flex: 1; cursor: pointer;" class="open-list-target" data-id="${list.id}">
                        <strong style="font-size: 16px;">${listSvg}<span style="color: var(--text-main);">${escapeHtml(list.name || 'Naamloze lijst')}</span></strong><br>
                        <small style="color: var(--text-muted);">Totaal: € ${total.toFixed(2).replace('.', ',')}</small>
                    </div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span class="badge ${statusClass}">${statusText}</span>
                        <button type="button" class="warning-red rename-list-btn" data-id="${list.id}" style="padding: 6px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px;">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> Wijzig
                        </button>
                    </div>
                `;

                const wrapper = createSwipeWrapper(list.id, 'list', cardContent, false);
                container.appendChild(wrapper);
            });
        }

        bindHomeScreenEvents(container);
    }

    const trashIconSvg = `
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            <line x1="10" y1="11" x2="10" y2="17"></line>
            <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
    `;

    function createSwipeWrapper(id, type, innerHtml, isProtected) {
        const wrapper = document.createElement('div');
        wrapper.className = 'swipe-wrapper';

        const bg = document.createElement('div');
        bg.className = 'swipe-action-bg';
        bg.innerHTML = trashIconSvg;
        wrapper.appendChild(bg);

        const card = document.createElement('div');
        card.className = type === 'folder' ? 'folder-card' : 'list-card';
        card.innerHTML = innerHtml;
        card.setAttribute('data-id', id);
        card.setAttribute('data-type', type);
        wrapper.appendChild(card);

        if (!isProtected) {
            let startX = 0;
            let currentX = 0;
            let isSwiping = false;

            card.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                currentX = startX;
                isSwiping = true;
                card.style.transition = 'none';
            }, { passive: true });

            card.addEventListener('touchmove', (e) => {
                if (!isSwiping) return;
                currentX = e.touches[0].clientX;
                let diff = currentX - startX;
                if (diff < 0) {
                    card.style.transform = `translateX(${Math.max(diff, -140)}px)`;
                }
            }, { passive: true });

            card.addEventListener('touchend', () => {
                if (!isSwiping) return;
                isSwiping = false;
                let diff = currentX - startX;
                card.style.transition = 'transform 0.15s ease-out';

                if (diff < -110) {
                    card.style.transform = 'translateX(-100%)';
                    setTimeout(() => deleteItem(type, id), 150);
                } else if (diff < -50) {
                    card.style.transform = 'translateX(-70px)';
                } else {
                    card.style.transform = 'translateX(0)';
                }
            });

            bg.addEventListener('click', () => {
                deleteItem(type, id);
            });
        }

        // Drag and Drop voor lijsten
        if (type === 'list') {
            card.setAttribute('draggable', 'true');
            card.addEventListener('dragstart', (e) => {
                e.dataTransfer.setData('text/plain', id);
                window.activeDraggingListId = id;
            });

            card.addEventListener('dragend', () => {
                window.activeDraggingListId = null;
            });
        }

        if (type === 'folder') {
            card.addEventListener('dragover', (e) => {
                e.preventDefault();
                card.classList.add('drag-over');
            });
            card.addEventListener('dragleave', () => {
                card.classList.remove('drag-over');
            });
            card.addEventListener('drop', (e) => {
                e.preventDefault();
                card.classList.remove('drag-over');
                const listId = e.dataTransfer.getData('text/plain') || window.activeDraggingListId;
                if (listId) {
                    const list = appData.lists.find(l => l.id === listId);
                    if (list) {
                        list.folderId = id;
                        saveToStorage();
                        renderFolders();
                    }
                }
            });
        }

        return wrapper;
    }

    function deleteItem(type, id) {
        if (type === 'folder') {
            appData.lists.forEach(l => { if (l.folderId === id) l.folderId = null; });
            appData.folders = appData.folders.filter(f => f.id !== id);
        } else {
            appData.lists = appData.lists.filter(l => l.id !== id);
        }
        saveToStorage();
        renderFolders();
    }

    function bindHomeScreenEvents(container) {
        container.querySelectorAll('.open-folder-target').forEach(el => {
            el.addEventListener('click', (e) => openFolder(e.currentTarget.getAttribute('data-id')));
        });
        container.querySelectorAll('.rename-folder-btn').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); openEditModal(e.currentTarget.getAttribute('data-id')); });
        });
        container.querySelectorAll('.open-list-target').forEach(el => {
            el.addEventListener('click', (e) => openList(e.currentTarget.getAttribute('data-id')));
        });
        container.querySelectorAll('.rename-list-btn').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); openEditListModal(e.currentTarget.getAttribute('data-id')); });
        });
    }

    function toggleFabDropdown(e) {
        e.stopPropagation();
        const dropdown = document.getElementById('fabDropdown');
        dropdown.style.display = dropdown.style.display === 'block' ? 'none' : 'block';
    }

    function closeFabDropdown() {
        const dropdown = document.getElementById('fabDropdown');
        if (dropdown) dropdown.style.display = 'none';
    }

    function openInputModal(mode) {
        inputModalMode = mode;
        closeFabDropdown();

        const titleEl = document.getElementById('inputModalTitle');
        const descEl = document.getElementById('inputModalDesc');
        const colorSec = document.getElementById('colorPickerSection');
        const nameInput = document.getElementById('dynamicInputName');

        nameInput.value = '';
        colorSec.style.display = 'block';

        if (mode === 'list') {
            titleEl.innerText = 'Lijst toevoegen';
            descEl.innerText = 'Geef de naam en kleur van de nieuwe lijst op:';
            selectedColorHex = '#38bdf8';
        } else {
            titleEl.innerText = 'Map toevoegen';
            descEl.innerText = 'Geef de naam en kleur van de nieuwe map op:';
            selectedColorHex = '#8b5cf6';
        }
        
        renderQuickColorPicker();
        document.getElementById('inputModalOverlay').style.display = 'flex';
        setTimeout(() => nameInput.focus(), 50);
    }

    function closeInputModal() {
        document.getElementById('inputModalOverlay').style.display = 'none';
    }

    function renderQuickColorPicker() {
        const grid = document.getElementById('quickColorPickerGrid');
        grid.innerHTML = '';
        availableColors.forEach(c => {
            const div = document.createElement('div');
            div.className = `color-option ${selectedColorHex === c.hex ? 'selected' : ''}`;
            div.style.backgroundColor = c.hex;
            div.title = c.name;
            div.addEventListener('click', () => {
                selectedColorHex = c.hex;
                renderQuickColorPicker();
            });
            grid.appendChild(div);
        });
    }

    function handleInputModalSave() {
        const nameInput = document.getElementById('dynamicInputName');
        const name = nameInput.value.trim();
        if (!name) { alert('Geef het eerst een naam.'); return; }

        if (inputModalMode === 'list') {
            const newList = {
                id: 'list_' + Date.now(),
                name: name,
                folderId: null,
                color: selectedColorHex,
                items: [],
                status: 'openstaand'
            };
            appData.lists.push(newList);
            saveToStorage();
            closeInputModal();
            renderFolders();
            openList(newList.id);
        } else {
            appData.folders.push({
                id: 'folder_' + Date.now(),
                name: name,
                color: selectedColorHex
            });
            saveToStorage();
            closeInputModal();
            renderFolders();
        }
    }

    function openEditModal(folderId) {
        const folder = appData.folders.find(f => f.id === folderId);
        if (!folder) return;
        editingFolderId = folderId;
        selectedColorHex = folder.color || '#3b82f6';
        document.getElementById('modalFolderNameInput').value = folder.name;
        renderColorPicker();
        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function renderColorPicker() {
        const grid = document.getElementById('colorPickerGrid');
        grid.innerHTML = '';
        availableColors.forEach(c => {
            const div = document.createElement('div');
            div.className = `color-option ${selectedColorHex === c.hex ? 'selected' : ''}`;
            div.style.backgroundColor = c.hex;
            div.addEventListener('click', () => { selectedColorHex = c.hex; renderColorPicker(); });
            grid.appendChild(div);
        });
    }

    function saveEditModal() {
        const folder = appData.folders.find(f => f.id === editingFolderId);
        if (!folder) return;
        const newName = document.getElementById('modalFolderNameInput').value.trim();
        if (newName !== "") folder.name = newName;
        folder.color = selectedColorHex;
        saveToStorage();
        closeEditModal();
        renderFolders();
    }

    function closeEditModal() {
        document.getElementById('modalOverlay').style.display = 'none';
        editingFolderId = null;
    }

    function openEditListModal(listId) {
        const list = appData.lists.find(l => l.id === listId);
        if (!list) return;
        editingListId = listId;
        selectedListColorHex = list.color || '#38bdf8';
        document.getElementById('modalListNameInput').value = list.name;
        renderEditListColorPicker();
        document.getElementById('editListModalOverlay').style.display = 'flex';
    }

    function renderEditListColorPicker() {
        const grid = document.getElementById('editListColorPickerGrid');
        grid.innerHTML = '';
        availableColors.forEach(c => {
            const div = document.createElement('div');
            div.className = `color-option ${selectedListColorHex === c.hex ? 'selected' : ''}`;
            div.style.backgroundColor = c.hex;
            div.addEventListener('click', () => { selectedListColorHex = c.hex; renderEditListColorPicker(); });
            grid.appendChild(div);
        });
    }

    function saveEditListModal() {
        const list = appData.lists.find(l => l.id === editingListId);
        if (!list) return;
        const newName = document.getElementById('modalListNameInput').value.trim();
        if (newName !== "") list.name = newName;
        list.color = selectedListColorHex;
        saveToStorage();
        closeEditListModal();
        renderFolders();
    }

    function closeEditListModal() {
        document.getElementById('editListModalOverlay').style.display = 'none';
        editingListId = null;
    }

    function openFolder(folderId) {
        activeFolderId = folderId;
        const folder = appData.folders.find(f => f.id === folderId);
        if (!folder) return;

        document.getElementById('currentFolderName').innerText = folder.name;
        document.getElementById('createListInFolderSection').style.display = (folderId === 'archief') ? 'none' : 'block';

        renderFolderLists();
        switchScreen('folderDetailScreen');
    }

    function renderFolderLists() {
        const container = document.getElementById('folderListsContainer');
        if (!container) return;
        container.innerHTML = '';

        const folderLists = appData.lists.filter(l => l.folderId === activeFolderId);
        if (folderLists.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: var(--text-muted); margin-top: 40px;">Geen lijsten in deze map.</p>';
            return;
        }

        folderLists.forEach(list => {
            const items = list.items || [];
            const total = items.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
            
            let statusClass = 'openstaand';
            let statusText = 'Openstaand';
            if (list.status === 'afgerond') { statusClass = 'afgerond'; statusText = 'Afgerond'; }
            else if (list.status === 'archief') { statusClass = 'archief'; statusText = 'Archief'; }

            const listColor = list.color || '#38bdf8';
            const listSvg = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${listColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -3px; margin-right: 6px;">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
            `;

            const cardContent = `
                <div style="flex: 1; cursor: pointer;" class="open-list-target" data-id="${list.id}">
                    <strong style="font-size: 16px;">${listSvg}<span style="color: var(--text-main);">${escapeHtml(list.name || 'Naamloze lijst')}</span></strong><br>
                    <small style="color: var(--text-muted);">Totaal: € ${total.toFixed(2).replace('.', ',')}</small>
                </div>
                <div style="display: flex; align-items: center; gap: 6px;">
                    <span class="badge ${statusClass}">${statusText}</span>
                    <button type="button" class="warning-red rename-list-btn" data-id="${list.id}" style="padding: 6px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px;">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> Wijzig
                    </button>
                </div>
            `;

            const wrapper = createSwipeWrapper(list.id, 'list', cardContent, false);
            container.appendChild(wrapper);
        });

        container.querySelectorAll('.open-list-target').forEach(el => {
            el.addEventListener('click', (e) => openList(e.currentTarget.getAttribute('data-id')));
        });
        container.querySelectorAll('.rename-list-btn').forEach(btn => {
            btn.addEventListener('click', (e) => { e.stopPropagation(); openEditListModal(e.currentTarget.getAttribute('data-id')); });
        });
    }

    function createNewListInFolder() {
        const input = document.getElementById('newListNameInFolder');
        const name = input.value.trim();
        if (!name) { alert('Geef de lijst eerst een naam.'); return; }

        const newList = {
            id: 'list_' + Date.now(),
            name: name,
            folderId: activeFolderId,
            color: '#38bdf8',
            items: [],
            status: 'openstaand'
        };

        appData.lists.push(newList);
        input.value = '';
        saveToStorage();
        renderFolderLists();
        openList(newList.id);
    }

    function openList(id) {
        activeListId = id;
        const list = appData.lists.find(l => l.id === id);
        if (!list) return;

        document.getElementById('currentListTitle').innerText = list.name;
        const statusBadge = document.getElementById('currentListStatus');
        const inputSection = document.getElementById('inputSection');
        const topActionContainer = document.getElementById('topActionContainer');
        const actionContainer = document.getElementById('actionButtonsContainer');

        statusBadge.className = `badge ${list.status === 'archief' ? 'archief' : (list.status || 'openstaand')}`;
        statusBadge.innerText = (list.status === 'afgerond') ? 'Afgerond' : (list.status === 'archief' ? 'Archief' : 'Openstaand');

        const checkButtonHtml = `
            <button type="button" class="success" id="checkIconBtn" style="width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Klaar
            </button>
        `;
        const checkIconSvg = `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        `;

        if (list.status === 'openstaand') {
            inputSection.style.display = 'block';
            topActionContainer.innerHTML = `<button type="button" class="heavy-danger" id="changeStatusBtn">LIJST AFRONDEN ${checkIconSvg}</button>`;
            actionContainer.innerHTML = checkButtonHtml;
            document.getElementById('changeStatusBtn').addEventListener('click', () => setListStatus('afgerond'));
        } else if (list.status === 'afgerond') {
            inputSection.style.display = 'none';
            topActionContainer.innerHTML = '';
            actionContainer.innerHTML = `
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="warning-red" id="archiveBtn" style="flex: 1; padding: 12px 18px; font-size: 15px; font-weight: 600;">Naar archief verplaatsen</button>
                </div>
                <button type="button" class="secondary" id="revertBtn" style="width: 100%; margin-top: 5px;">Terugzetten naar Openstaand</button>
                ${checkButtonHtml}
            `;
            document.getElementById('archiveBtn').addEventListener('click', () => setListStatus('archief'));
            document.getElementById('revertBtn').addEventListener('click', () => setListStatus('openstaand'));
        } else {
            inputSection.style.display = 'none';
            topActionContainer.innerHTML = '';
            actionContainer.innerHTML = `
                <button type="button" class="secondary" id="revertBtn" style="width: 100%; margin-bottom: 5px;">Terugzetten naar Openstaand</button>
                ${checkButtonHtml}
            `;
            document.getElementById('revertBtn').addEventListener('click', () => setListStatus('openstaand'));
        }

        document.getElementById('checkIconBtn').addEventListener('click', handleBackAction);
        renderAmounts();
        switchScreen('detailScreen');
    }

    function setListStatus(newStatus) {
        const list = appData.lists.find(l => l.id === activeListId);
        if (!list) return;

        if (newStatus === 'afgerond') {
            if (!confirm(`Weet je zeker dat je de lijst "${list.name}" wilt afronden?`)) return;
        }

        list.status = newStatus;
        if (newStatus === 'archief') list.folderId = 'archief';
        
        saveToStorage();
        openList(list.id);
    }

    function renderAmounts() {
        const list = appData.lists.find(l => l.id === activeListId);
        const container = document.getElementById('amountsContainer');
        if (!container) return;
        container.innerHTML = '';

        const isEditable = (list.status === 'openstaand');

        if (!list || !list.items || list.items.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: var(--text-muted); margin-top: 20px;">Nog geen bedragen ingevoerd.</p>';
            document.getElementById('totalAmount').innerText = '€ 0,00';
            return;
        }

        let total = 0;
        list.items.forEach((item, index) => {
            const amt = parseFloat(item.amount) || 0;
            total += amt;
            const itemCard = document.createElement('div');
            itemCard.className = 'list-item-card';
            
            let actionButtonsHtml = '';
            if (isEditable) {
                actionButtonsHtml = `
                    <div style="display: flex; gap: 6px;">
                        <button type="button" class="warning edit-btn" data-index="${index}" style="padding: 6px 10px; font-size: 12px;">Bewerk</button>
                        <button type="button" class="danger delete-btn" data-index="${index}" style="padding: 6px 10px; font-size: 12px;">Wis</button>
                    </div>
                `;
            }

            itemCard.innerHTML = `
                <div style="overflow: hidden; padding-right: 10px;">
                    <strong style="font-size: 15px;">${escapeHtml(item.desc)}</strong><br>
                    <span style="color: #38bdf8; font-weight: 600;">€ ${amt.toFixed(2).replace('.', ',')}</span>
                </div>
                ${actionButtonsHtml}
            `;
            container.appendChild(itemCard);
        });

        if (isEditable) {
            container.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => editItem(parseInt(e.target.getAttribute('data-index'))));
            });
            container.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => removeItem(parseInt(e.target.getAttribute('data-index'))));
            });
        }

        document.getElementById('totalAmount').innerText = '€ ' + total.toFixed(2).replace('.', ',');
    }

    function addAmount() {
        const list = appData.lists.find(l => l.id === activeListId);
        if (!list || list.status !== 'openstaand') return;

        const descInput = document.getElementById('itemDescription');
        const amountInput = document.getElementById('amountInput');
        const desc = descInput.value.trim() || 'Naamloos';
        const val = parseFloat(amountInput.value.replace(',', '.'));

        if (isNaN(val) || val <= 0) { alert('Voer een geldig bedrag in.'); return; }

        list.items.push({ desc: desc, amount: val });
        descInput.value = '';
        amountInput.value = '';
        saveToStorage();
        renderAmounts();
    }

    function editItem(index) {
        const list = appData.lists.find(l => l.id === activeListId);
        if (!list || list.status !== 'openstaand') return;

        const currentItem = list.items[index];
        const newDesc = prompt("Bewerk omschrijving:", currentItem.desc);
        if (newDesc === null) return;

        const newAmountStr = prompt("Bewerk bedrag in €:", currentItem.amount.toString().replace('.', ','));
        if (newAmountStr === null) return;

        const newAmount = parseFloat(newAmountStr.replace(',', '.'));
        if (isNaN(newAmount) || newAmount <= 0) { alert('Ongeldig bedrag ingevoerd.'); return; }

        list.items[index] = { desc: newDesc.trim() || 'Naamloos', amount: newAmount };
        saveToStorage();
        renderAmounts();
    }

    function removeItem(index) {
        const list = appData.lists.find(l => l.id === activeListId);
        if (!list || list.status !== 'openstaand') return;

        list.items.splice(index, 1);
        saveToStorage();
        renderAmounts();
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const target = document.getElementById(screenId);
        if (target) target.classList.add('active');
    }

    function handleBackAction() {
        if (activeFolderId) openFolder(activeFolderId);
        else { renderFolders(); switchScreen('homeScreen'); }
    }

    function escapeHtml(text) {
        if (!text) return '';
        const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
        return text.toString().replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById('fabBtn').addEventListener('click', toggleFabDropdown);
        document.getElementById('menuAddListBtn').addEventListener('click', () => openInputModal('list'));
        document.getElementById('menuAddFolderBtn').addEventListener('click', () => openInputModal('folder'));

        document.addEventListener('click', closeFabDropdown);

        document.getElementById('inputModalCancelBtn').addEventListener('click', closeInputModal);
        document.getElementById('inputModalSaveBtn').addEventListener('click', handleInputModalSave);

        document.getElementById('editListSaveBtn').addEventListener('click', saveEditListModal);
        document.getElementById('editListCancelBtn').addEventListener('click', closeEditListModal);

        document.getElementById('createListInFolderBtn').addEventListener('click', createNewListInFolder);
        document.getElementById('addAmountBtn').addEventListener('click', addAmount);
        
        document.getElementById('backToHomeBtn').addEventListener('click', () => {
            activeFolderId = null;
            renderFolders();
            switchScreen('homeScreen');
        });

        document.getElementById('backToFolderBtn').addEventListener('click', handleBackAction);

        document.getElementById('modalSaveBtn').addEventListener('click', saveEditModal);
        document.getElementById('modalCancelBtn').addEventListener('click', closeEditModal);

        renderFolders();
    });

    window.onload = function() {
        renderFolders();
    };
</script>

</body>
