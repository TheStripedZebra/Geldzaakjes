<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geldzaakjes App</title>
    <style>
        :root {
            --bg-dark: #070913;
            --card-bg: #111528;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            
            --gradient-accent: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            --gradient-total: linear-gradient(135deg, rgba(59, 130, 246, 0.15) 0%, rgba(139, 92, 246, 0.15) 100%);
            
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #10b981;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at top, #1e1b4b 0%, #070913 70%);
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
            padding: 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            min-height: 85vh;
            position: relative;
        }

        h1, h2 {
            margin-top: 0;
            color: var(--text-main);
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
        }

        button {
            background: var(--gradient-accent);
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.98);
        }

        button:hover {
            opacity: 0.9;
        }

        button.secondary {
            background: rgba(255, 255, 255, 0.08);
            box-shadow: none;
            color: var(--text-main);
        }
        button.secondary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        button.danger {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            box-shadow: none;
        }
        button.danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        /* LIJST AFRONDEN knop */
        button.heavy-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 2px solid #ef4444;
            box-shadow: none;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 6px 12px;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        button.heavy-danger:hover {
            background: rgba(239, 68, 68, 0.35);
        }

        /* Rode Wijzig knop & Archief verplaatsen knop */
        button.warning-red {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            box-shadow: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        button.warning-red:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        button.success {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            box-shadow: none;
        }
        button.success:hover {
            background: rgba(16, 185, 129, 0.3);
        }

        button.info-btn {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            box-shadow: none;
        }
        button.info-btn:hover {
            background: rgba(59, 130, 246, 0.3);
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 12px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="number"]:focus {
            border-color: #8b5cf6;
        }

        input::placeholder {
            color: #6b7280;
        }

        .screen {
            display: none;
            flex-direction: column;
            flex: 1;
        }

        .screen.active {
            display: flex;
        }

        .list-item-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .scrollable-list {
            flex: 1;
            overflow-y: auto;
            max-height: 320px;
            margin-bottom: 15px;
            border-top: 1px solid var(--card-border);
            border-bottom: 1px solid var(--card-border);
            padding-top: 12px;
            padding-bottom: 12px;
        }

        .total-section {
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            padding: 16px;
            background: var(--gradient-total);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 14px;
            margin-bottom: 15px;
            align-items: center;
        }

        .folder-card, .list-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s, border-color 0.2s;
        }

        .folder-card:hover, .list-card:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .badge {
            font-size: 11px;
            padding: 5px 10px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: inline-block;
            text-align: center;
        }
        .badge.openstaand { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge.afgerond { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .badge.archief { background: rgba(156, 163, 175, 0.2); color: #9ca3af; border: 1px solid rgba(156, 163, 175, 0.3); }

        .actions-bottom {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* IN-APP MODAL STYLING */
        #modalOverlay, #moveModalOverlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(7, 9, 19, 0.85);
            backdrop-filter: blur(4px);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 20px;
            border-radius: 24px;
        }

        .modal-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        .color-picker-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .color-option {
            height: 40px;
            border-radius: 10px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s;
        }

        .color-option:hover {
            transform: scale(1.05);
        }

        .color-option.selected {
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HOOFDSCHERM (MAP-OVERZICHT) -->
    <div id="homeScreen" class="screen active">
        <h1>Geldzaakjes</h1>
        <p>Organiseer je lijsten in mappen.</p>
        
        <div style="margin-bottom: 15px;">
            <input type="text" id="newFolderName" placeholder="Naam nieuwe map (bijv. Vakantie)">
            <button type="button" id="createFolderBtn" class="secondary" style="width: 100%;">Nieuwe Map Aanmaken</button>
        </div>

        <div class="scrollable-list" id="foldersContainer">
            <!-- Mappen komen hier -->
        </div>
    </div>

    <!-- MAP DETAIL SCHERM (LIJSTEN BINNEN EEN MAP) -->
    <div id="folderDetailScreen" class="screen">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px;">
            <button type="button" class="secondary" id="backToHomeBtn">← Terug</button>
            <h2 id="currentFolderName" style="margin: 0; font-size: 18px; text-align: center; flex: 1; padding: 0 10px;">Map</h2>
        </div>

        <div id="createListInFolderSection" style="margin-bottom: 15px;">
            <input type="text" id="newListName" placeholder="Naam nieuwe lijst in deze map">
            <button type="button" id="createListBtn" style="width: 100%;">Lijst Aanmaken in deze Map</button>
        </div>

        <div class="scrollable-list" id="folderListsContainer">
            <!-- Lijsten binnen deze map komen hier -->
        </div>
    </div>

    <!-- DETAILS / INVOER SCHERM VOOR BEDRAGEN -->
    <div id="detailScreen" class="screen">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; gap: 8px;">
            <button type="button" class="secondary" id="backToFolderBtn" style="padding: 10px 14px;">← Terug</button>
            <h2 id="currentListTitle" style="margin: 0; font-size: 18px; text-align: center; flex: 1; padding: 0 5px;">Lijst</h2>
            
            <!-- RECHTSBOVEN: Badge met daaronder de knop -->
            <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px;">
                <span id="currentListStatus" class="badge openstaand">Openstaand</span>
                <div id="topActionContainer">
                    <!-- LIJST AFRONDEN knop -->
                </div>
            </div>
        </div>

        <div id="inputSection" style="margin-bottom: 10px;">
            <input type="text" id="itemDescription" placeholder="Omschrijving (bijv. Supermarkt)">
            <input type="number" id="amountInput" step="0.01" placeholder="Bedrag in € (bijv. 12.50)">
            <button type="button" id="addAmountBtn" style="width: 100%;">Bedrag Toevoegen</button>
        </div>

        <div class="scrollable-list" id="amountsContainer">
            <!-- Bedragen komen hier -->
        </div>

        <div class="total-section">
            <span style="color: var(--text-muted); font-size: 15px;">Totaalbedrag:</span>
            <span id="totalAmount" style="color: #34d399; font-size: 20px;">€ 0,00</span>
        </div>

        <div class="actions-bottom" id="actionButtonsContainer">
            <!-- Vinkje onderaan -->
        </div>
    </div>

    <!-- IN-APP WIJZIG MODAL -->
    <div id="modalOverlay">
        <div class="modal-box">
            <h2>Map Wijzigen</h2>
            <p style="margin-bottom: 15px;">Pas de naam en icoonkleur aan.</p>
            
            <input type="text" id="modalFolderNameInput" placeholder="Naam van de map">
            
            <label style="font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 8px;">Kies een kleur:</label>
            <div class="color-picker-grid" id="colorPickerGrid">
                <!-- Kleurenopties -->
            </div>

            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" class="secondary" id="modalCancelBtn" style="flex: 1;">Annuleren</button>
                <button type="button" id="modalSaveBtn" style="flex: 1;">Opslaan</button>
            </div>
        </div>
    </div>

    <!-- IN-APP VERPLAATS MODAL (MAPPEN-STIJL) -->
    <div id="moveModalOverlay">
        <div class="modal-box">
            <h2>Verplaats Lijst</h2>
            <p style="margin-bottom: 15px;">Kies de doelmap voor deze lijst:</p>
            
            <div id="moveFolderOptionsContainer" style="max-height: 220px; overflow-y: auto; margin-bottom: 15px;">
                <!-- Dynamische mappenkaarten -->
            </div>

            <button type="button" class="secondary" id="moveModalCancelBtn" style="width: 100%;">Annuleren</button>
        </div>
    </div>
</div>

<script>
    let appData = {
        folders: [
            { id: 'default', name: 'Algemeen', color: '#3b82f6' },
            { id: 'archief', name: 'Archief', color: '#9ca3af' }
        ],
        lists: []
    };

    const availableColors = [
        { name: 'Neon Blauw', hex: '#3b82f6' },
        { name: 'Paars', hex: '#8b5cf6' },
        { name: 'Roze', hex: '#ec4899' },
        { name: 'Groen', hex: '#10b981' },
        { name: 'Oranje', hex: '#f59e0b' },
        { name: 'Rood', hex: '#ef4444' },
        { name: 'Cyaan', hex: '#06b6d4' },
        { name: 'Zilver', hex: '#9ca3af' }
    ];

    try {
        const saved = localStorage.getItem('bedragLijsten_v24');
        if (saved) {
            appData = JSON.parse(saved);
            if (!appData.folders.some(f => f.id === 'archief')) {
                appData.folders.push({ id: 'archief', name: 'Archief', color: '#9ca3af' });
            }
            if (!appData.folders.some(f => f.id === 'default')) {
                appData.folders.unshift({ id: 'default', name: 'Algemeen', color: '#3b82f6' });
            }
            appData.folders.forEach(f => { if (!f.color) f.color = '#3b82f6'; });
        }
    } catch (e) {
        console.error("Fout bij laden opslag:", e);
    }

    let activeFolderId = null;
    let activeListId = null;
    let editingFolderId = null;
    let movingListId = null;
    let selectedColorHex = '#3b82f6';

    function saveToStorage() {
        try {
            localStorage.setItem('bedragLijsten_v24', JSON.stringify(appData));
        } catch (e) {
            console.error("Fout bij opslaan:", e);
        }
    }

    // --- HOOFDSCHERM: MAPPEN RENDEREN ---
    function renderFolders() {
        const container = document.getElementById('foldersContainer');
        if (!container) return;
        container.innerHTML = '';

        appData.folders.forEach(folder => {
            const folderLists = appData.lists.filter(l => (l.folderId || 'default') === folder.id);

            const card = document.createElement('div');
            card.className = 'folder-card';
            
            let actionButtonsHtml = '';
            actionButtonsHtml += `
                <button type="button" class="warning-red rename-folder-btn" data-id="${folder.id}" style="padding: 6px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 4px;">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg> Wijzig
                </button>`;
            
            if (folder.id !== 'default' && folder.id !== 'archief') {
                actionButtonsHtml += `<button type="button" class="danger delete-folder-btn" data-id="${folder.id}" style="padding: 6px 10px; font-size: 12px;">Wis</button>`;
            }

            const folderColor = folder.color || '#3b82f6';
            const folderSvg = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${folderColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -3px; margin-right: 6px;">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
            `;

            card.innerHTML = `
                <div style="flex: 1; cursor: pointer;" class="open-folder-target" data-id="${folder.id}">
                    <strong style="font-size: 16px;">${folderSvg}<span style="color: var(--text-main);">${escapeHtml(folder.name)}</span></strong><br>
                    <small style="color: var(--text-muted);">${folderLists.length} lijsten</small>
                </div>
                <div style="display: flex; align-items: center; gap: 6px;">
                    ${actionButtonsHtml}
                </div>
            `;
            container.appendChild(card);
        });

        container.querySelectorAll('.open-folder-target').forEach(el => {
            el.addEventListener('click', (e) => {
                openFolder(e.currentTarget.getAttribute('data-id'));
            });
        });

        container.querySelectorAll('.rename-folder-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                openEditModal(e.currentTarget.getAttribute('data-id'));
            });
        });

        container.querySelectorAll('.delete-folder-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteFolder(e.target.getAttribute('data-id'));
            });
        });
    }

    function createNewFolder() {
        const input = document.getElementById('newFolderName');
        if (!input) return;
        const name = input.value.trim();
        if (!name) {
            alert('Geef de map eerst een naam.');
            return;
        }

        const newFolder = {
            id: 'folder_' + Date.now(),
            name: name,
            color: '#8b5cf6'
        };

        appData.folders.push(newFolder);
        input.value = '';
        saveToStorage();
        renderFolders();
    }

    // --- IN-APP MODAL LOGICA (WIJZIG MAP) ---
    function openEditModal(folderId) {
        const folder = appData.folders.find(f => f.id === folderId);
        if (!folder) return;

        editingFolderId = folderId;
        selectedColorHex = folder.color || '#3b82f6';

        document.getElementById('modalFolderNameInput').value = folder.name;
        renderColorPicker();

        document.getElementById('modalOverlay').style.display = 'flex';
    }

    function renderColorPicker() {
        const grid = document.getElementById('colorPickerGrid');
        grid.innerHTML = '';

        availableColors.forEach(c => {
            const div = document.createElement('div');
            div.className = `color-option ${selectedColorHex === c.hex ? 'selected' : ''}`;
            div.style.backgroundColor = c.hex;
            div.title = c.name;
            div.addEventListener('click', () => {
                selectedColorHex = c.hex;
                renderColorPicker();
            });
            grid.appendChild(div);
        });
    }

    function saveEditModal() {
        const folder = appData.folders.find(f => f.id === editingFolderId);
        if (!folder) return;

        const newName = document.getElementById('modalFolderNameInput').value.trim();
        if (newName !== "") {
            folder.name = newName;
        }
        folder.color = selectedColorHex;

        saveToStorage();
        closeEditModal();
        renderFolders();
    }

    function closeEditModal() {
        document.getElementById('modalOverlay').style.display = 'none';
        editingFolderId = null;
    }

    function deleteFolder(id) {
        if (!confirm('Weet je zeker dat je deze map wilt verwijderen? Lijsten in deze map worden verplaatst naar Algemeen.')) return;
        
        appData.lists.forEach(l => {
            if (l.folderId === id) l.folderId = 'default';
        });

        appData.folders = appData.folders.filter(f => f.id !== id);
        saveToStorage();
        renderFolders();
    }

    // --- IN-APP MODAL LOGICA (VERPLAATS LIJST - MAPPEN STIJL) ---
    function openMoveModal(listId) {
        movingListId = listId;
        const container = document.getElementById('moveFolderOptionsContainer');
        container.innerHTML = '';

        appData.folders.forEach(folder => {
            const folderLists = appData.lists.filter(l => (l.folderId || 'default') === folder.id);
            const folderColor = folder.color || '#3b82f6';
            const folderSvg = `
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="${folderColor}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: -3px; margin-right: 6px;">
                    <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                </svg>
            `;

            const card = document.createElement('div');
            card.className = 'folder-card';
            card.style.cursor = 'pointer';
            card.innerHTML = `
                <div style="flex: 1;">
                    <strong style="font-size: 16px;">${folderSvg}<span style="color: var(--text-main);">${escapeHtml(folder.name)}</span></strong><br>
                    <small style="color: var(--text-muted);">${folderLists.length} lijsten</small>
                </div>
            `;
            card.addEventListener('click', () => {
                executeMoveList(folder.id);
            });
            container.appendChild(card);
        });

        document.getElementById('moveModalOverlay').style.display = 'flex';
    }

    function executeMoveList(targetFolderId) {
        const list = appData.lists.find(l => l.id === movingListId);
        if (list) {
            list.folderId = targetFolderId;
            saveToStorage();
            renderFolderLists();
        }
        closeMoveModal();
    }

    function closeMoveModal() {
        document.getElementById('moveModalOverlay').style.display = 'none';
        movingListId = null;
    }

    // --- MAP DETAIL SCHERM: LIJSTEN IN EEN MAP ---
    function openFolder(folderId) {
        activeFolderId = folderId;
        const folder = appData.folders.find(f => f.id === folderId);
        if (!folder) return;

        const titleEl = document.getElementById('currentFolderName');
        if (titleEl) titleEl.innerText = folder.name;

        const createSection = document.getElementById('createListInFolderSection');
        if (folderId === 'archief') {
            createSection.style.display = 'none';
        } else {
            createSection.style.display = 'block';
        }

        renderFolderLists();
        switchScreen('folderDetailScreen');
    }

    function renderFolderLists() {
        const container = document.getElementById('folderListsContainer');
        if (!container) return;
        container.innerHTML = '';

        const folderLists = appData.lists.filter(l => (l.folderId || 'default') === activeFolderId);

        if (folderLists.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: var(--text-muted); margin-top: 40px;">Geen lijsten in deze map.</p>';
            return;
        }

        folderLists.forEach(list => {
            const items = list.items || [];
            const total = items.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
            const card = document.createElement('div');
            card.className = 'list-card';
            
            let statusClass = 'openstaand';
            let statusText = 'Openstaand';
            if (list.status === 'afgerond') {
                statusClass = 'afgerond';
                statusText = 'Afgerond';
            } else if (list.status === 'archief') {
                statusClass = 'archief';
                statusText = 'Archief';
            }

            card.innerHTML = `
                <div style="flex: 1; cursor: pointer;" class="open-list-target" data-id="${list.id}">
                    <strong style="font-size: 16px;">${escapeHtml(list.name || 'Naamloze lijst')}</strong><br>
                    <small style="color: var(--text-muted);">Totaal: € ${total.toFixed(2).replace('.', ',')}</small>
                </div>
                <div style="display: flex; align-items: center; gap: 6px;">
                    <button type="button" class="info-btn move-list-btn" data-id="${list.id}" style="padding: 6px 10px; font-size: 12px;">Verplaats</button>
                    <span class="badge ${statusClass}">${statusText}</span>
                    <button type="button" class="danger delete-list-btn" data-id="${list.id}" style="padding: 6px 10px; font-size: 12px;">Wis</button>
                </div>
            `;
            container.appendChild(card);
        });

        container.querySelectorAll('.open-list-target').forEach(el => {
            el.addEventListener('click', (e) => {
                openList(e.currentTarget.getAttribute('data-id'));
            });
        });

        container.querySelectorAll('.move-list-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                openMoveModal(e.target.getAttribute('data-id'));
            });
        });

        container.querySelectorAll('.delete-list-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                deleteList(e.target.getAttribute('data-id'));
            });
        });
    }

    function createNewListInFolder() {
        const input = document.getElementById('newListName');
        if (!input) return;
        const name = input.value.trim();
        
        if (!name) {
            alert('Geef de lijst eerst een naam.');
            return;
        }

        const newList = {
            id: 'list_' + Date.now(),
            name: name,
            folderId: activeFolderId,
            items: [],
            status: 'openstaand'
        };

        appData.lists.push(newList);
        input.value = '';
        saveToStorage();
        renderFolderLists();
        openList(newList.id);
    }

    function deleteList(id) {
        if (!confirm('Weet je zeker dat je deze lijst wilt verwijderen?')) return;
        appData.lists = appData.lists.filter(l => l.id !== id);
        saveToStorage();
        if (activeFolderId) {
            renderFolderLists();
        }
    }

    // --- DETAILSCHERM VAN EEN LIJST ---
    function openList(id) {
        activeListId = id;
        const list = appData.lists.find(l => l.id === id);
        if (!list) return;

        const titleEl = document.getElementById('currentListTitle');
        if (titleEl) titleEl.innerText = list.name;

        const statusBadge = document.getElementById('currentListStatus');
        const inputSection = document.getElementById('inputSection');
        const topActionContainer = document.getElementById('topActionContainer');
        const actionContainer = document.getElementById('actionButtonsContainer');

        statusBadge.className = `badge ${list.status === 'archief' ? 'archief' : (list.status || 'openstaand')}`;
        statusBadge.innerText = (list.status === 'afgerond') ? 'Afgerond' : (list.status === 'archief' ? 'Archief' : 'Openstaand');
        statusBadge.onclick = null;

        // Strak line-art vinkje onderaan
        const checkButtonHtml = `
            <button type="button" class="success" id="checkIconBtn" style="width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Klaar
            </button>
        `;

        // Vinkje met tekst voor LIJST AFRONDEN
        const checkIconSvg = `
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        `;

        if (list.status === 'openstaand') {
            inputSection.style.display = 'block';
            topActionContainer.innerHTML = `
                <button type="button" class="heavy-danger" id="changeStatusBtn">LIJST AFRONDEN ${checkIconSvg}</button>
            `;
            actionContainer.innerHTML = checkButtonHtml;
            document.getElementById('changeStatusBtn').addEventListener('click', () => setListStatus('afgerond'));
        } else if (list.status === 'afgerond') {
            inputSection.style.display = 'none';
            topActionContainer.innerHTML = '';
            actionContainer.innerHTML = `
                <div style="display: flex; gap: 10px;">
                    <button type="button" class="warning-red" id="archiveBtn" style="flex: 1; padding: 12px 18px; font-size: 15px; font-weight: 600;">Naar archief verplaatsen</button>
                </div>
                <button type="button" class="secondary" id="revertBtn" style="width: 100%; margin-top: 5px;">Terugzetten naar Openstaand</button>
                ${checkButtonHtml}
            `;
            document.getElementById('archiveBtn').addEventListener('click', () => setListStatus('archief'));
            document.getElementById('revertBtn').addEventListener('click', () => setListStatus('openstaand'));
        } else {
            inputSection.style.display = 'none';
            topActionContainer.innerHTML = '';
            actionContainer.innerHTML = `
                <button type="button" class="secondary" id="revertBtn" style="width: 100%; margin-bottom: 5px;">Terugzetten naar Openstaand</button>
                ${checkButtonHtml}
            `;
            document.getElementById('revertBtn').addEventListener('click', () => setListStatus('openstaand'));
        }

        document.getElementById('checkIconBtn').addEventListener('click', handleBackAction);

        renderAmounts();
        switchScreen('detailScreen');
    }

    function setListStatus(newStatus) {
        const list = appData.lists.find(l => l.id === activeListId);
        if (!list) return;

        if (newStatus === 'afgerond') {
            if (!confirm(`Weet je zeker dat je de lijst "${list.name}" wilt afronden?`)) return;
        }

        list.status = newStatus;
        if (newStatus === 'archief') {
            list.folderId = 'archief';
        }
        
        saveToStorage();
        openList(list.id);
    }

    function renderAmounts() {
        const list = appData.lists.find(l => l.id === activeListId);
        const container = document.getElementById('amountsContainer');
        if (!container) return;
        container.innerHTML = '';

        const isEditable = (list.status === 'openstaand');

        if (!list || !list.items || list.items.length === 0) {
            container.innerHTML = '<p style="text-align: center; color: var(--text-muted); margin-top: 20px;">Nog geen bedragen ingevoerd.</p>';
            const totalEl = document.getElementById('totalAmount');
            if (totalEl) totalEl.innerText = '€ 0,00';
            return;
        }

        let total = 0;
        list.items.forEach((item, index) => {
            const amt = parseFloat(item.amount) || 0;
            total += amt;
            const itemCard = document.createElement('div');
            itemCard.className = 'list-item-card';
            
            let actionButtonsHtml = '';
            if (isEditable) {
                actionButtonsHtml = `
                    <div style="display: flex; gap: 6px;">
                        <button type="button" class="warning edit-btn" data-index="${index}" style="padding: 6px 10px; font-size: 12px;">Bewerk</button>
                        <button type="button" class="danger delete-btn" data-index="${index}" style="padding: 6px 10px; font-size: 12px;">Wis</button>
                    </div>
                `;
            }

            itemCard.innerHTML = `
                <div style="overflow: hidden; padding-right: 10px;">
                    <strong style="font-size: 15px;">${escapeHtml(item.desc)}</strong><br>
                    <span style="color: #38bdf8; font-weight: 600;">€ ${amt.toFixed(2).replace('.', ',')}</span>
                </div>
                ${actionButtonsHtml}
            `;
            container.appendChild(itemCard);
        });

        if (isEditable) {
            container.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    editItem(parseInt(e.target.getAttribute('data-index')));
                });
            });
            container.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    removeItem(parseInt(e.target.getAttribute('data-index')));
                });
            });
        }

        const totalEl = document.getElementById('totalAmount');
        if (totalEl) totalEl.innerText = '€ ' + total.toFixed(2).replace('.', ',');
    }

    function addAmount() {
        const list = appData.lists.find(l => l.id === activeListId);
        if (!list || list.status !== 'openstaand') return;

        const descInput = document.getElementById('itemDescription');
        const amountInput = document.getElementById('amountInput');
        if (!descInput || !amountInput) return;
        
        const desc = descInput.value.trim() || 'Naamloos';
        const val = parseFloat(amountInput.value.replace(',', '.'));

        if (isNaN(val) || val <= 0) {
            alert('Voer een geldig bedrag in.');
            return;
        }

        list.items.push({ desc: desc, amount: val });
        descInput.value = '';
        amountInput.value = '';
        saveToStorage();
        renderAmounts();
    }

    function editItem(index) {
        const list = appData.lists.find(l => l.id === activeListId);
        if (!list || list.status !== 'openstaand') return;

        const currentItem = list.items[index];

        const newDesc = prompt("Bewerk omschrijving:", currentItem.desc);
        if (newDesc === null) return;

        const newAmountStr = prompt("Bewerk bedrag in €:", currentItem.amount.toString().replace('.', ','));
        if (newAmountStr === null) return;

        const newAmount = parseFloat(newAmountStr.replace(',', '.'));
        if (isNaN(newAmount) || newAmount <= 0) {
            alert('Ongeldig bedrag ingevoerd. Wijziging geannuleerd.');
            return;
        }

        list.items[index] = {
            desc: newDesc.trim() || 'Naamloos',
            amount: newAmount
        };

        saveToStorage();
        renderAmounts();
    }

    function removeItem(index) {
        const list = appData.lists.find(l => l.id === activeListId);
        if (!list || list.status !== 'openstaand') return;

        list.items.splice(index, 1);
        saveToStorage();
        renderAmounts();
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const target = document.getElementById(screenId);
        if (target) target.classList.add('active');
    }

    function handleBackAction() {
        openFolder(activeFolderId);
    }

    function escapeHtml(text) {
        if (!text) return '';
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text.toString().replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    document.addEventListener("DOMContentLoaded", function() {
        document.getElementById('createFolderBtn').addEventListener('click', createNewFolder);
        document.getElementById('createListBtn').addEventListener('click', createNewListInFolder);
        document.getElementById('addAmountBtn').addEventListener('click', addAmount);
        
        document.getElementById('backToHomeBtn').addEventListener('click', () => {
            activeFolderId = null;
            renderFolders();
            switchScreen('homeScreen');
        });

        document.getElementById('backToFolderBtn').addEventListener('click', handleBackAction);

        // Modal knoppen koppelen
        document.getElementById('modalSaveBtn').addEventListener('click', saveEditModal);
        document.getElementById('modalCancelBtn').addEventListener('click', closeEditModal);
        document.getElementById('moveModalCancelBtn').addEventListener('click', closeMoveModal);

        renderFolders();
    });

    window.onload = function() {
        renderFolders();
    };
</script>
